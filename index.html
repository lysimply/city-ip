<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * { -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', sans-serif;

  }
  .serif { font-family: 'Songti SC', 'STSong', 'SimSun', Georgia, serif; }
  .card-shadow { box-shadow: 0 20px 60px -15px rgba(180, 100, 50, 0.25); }
  .option-card {
    transition: all 0.3s cubic-bezier(.2,.8,.2,1);
  }
  .option-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px -8px rgba(180, 100, 50, 0.3);
  }
  .option-card.selected {
    background: linear-gradient(135deg, #f97316, #ea580c);
    color: white;
    border-color: #f97316;
    transform: translateY(-2px);
  }
  .fade-in {
    animation: fadeIn 0.5s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .progress-bar {
    background: linear-gradient(90deg, #f97316, #fbbf24);
    transition: width 0.5s cubic-bezier(.2,.8,.2,1);
  }
  .loading-dot {
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .loading-dot:nth-child(1) { animation-delay: -0.32s; }
  .loading-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }
  .result-reveal {
    animation: reveal 0.8s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes reveal {
    from { opacity: 0; transform: scale(0.9) translateY(30px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .tag-chip {
    transition: all 0.2s ease;
  }
  .hidden-section { display: none !important; }
  .progress-pulse {
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
  .float-deco {
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(2deg); }
  }
</style>
</head>
<body class="min-h-screen">

    </div>

        </div>

        </p>
      </div>

      <div class="flex flex-wrap gap-2 mb-5">
        <!-- 由JS生成标签 -->
      </div>

        </button>
        <button onclick="shareResult()" class="flex-1 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-semibold py-3.5 px-6 rounded-2xl card-shadow text-base hover:from-orange-600 hover:to-amber-600 transition-all active:scale-95">

</div>

</div>

// ============ 游戏状态 ============
let currentQIndex = 0;
let scores = { chill:0, ambitious:0, relax:0, energetic:0, introvert:0, outgoing:0, romantic:0, practical:0 };
let selectedOption = -1;
let answers = [];

function startQuiz() {
  document.getElementById('welcome').classList.add('hidden-section');
  document.getElementById('quiz').classList.remove('hidden-section');
  currentQIndex = 0;
  scores = { chill:0, ambitious:0, relax:0, energetic:0, introvert:0, outgoing:0, romantic:0, practical:0 };
  answers = [];
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQIndex];
  document.getElementById('currentQ').textContent = currentQIndex + 1;
  const pct = Math.round(((currentQIndex + 1) / 15) * 100);
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressBar').style.width = ((currentQIndex + 1) / 15 * 100) + '%';
  document.getElementById('questionEmoji').textContent = q.emoji;
  document.getElementById('questionText').textContent = q.text;

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  selectedOption = -1;
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = true;
  nextBtn.className = 'w-full mt-6 bg-gray-300 text-white font-semibold py-3.5 px-6 rounded-2xl text-base transition-all active:scale-95 cursor-not-allowed';
  nextBtn.textContent = currentQIndex === 14 ? '查看结果 🎉' : '下一题 →';

  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-card w-full text-left bg-white border-2 border-gray-100 rounded-xl p-4 text-gray-700 text-[15px] leading-relaxed hover:border-orange-200';
    btn.textContent = opt.text;
    btn.onclick = () => selectOption(idx, btn);
    container.appendChild(btn);
  });

  // 重新触发入场动画
  const card = document.getElementById('questionCard');
  card.style.opacity = '1';
  card.classList.remove('fade-in');
  void card.offsetWidth;
  card.classList.add('fade-in');
}

function selectOption(idx, btnEl) {
  document.querySelectorAll('.option-card').forEach(el => el.classList.remove('selected'));
  btnEl.classList.add('selected');
  selectedOption = idx;
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = false;
  nextBtn.className = 'w-full mt-6 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-semibold py-3.5 px-6 rounded-2xl text-base hover:from-orange-600 hover:to-amber-600 transition-all active:scale-95 card-shadow cursor-pointer';
}

function nextQuestion() {
  if (selectedOption === -1) return;
  const opt = questions[currentQIndex].options[selectedOption];
  answers.push(selectedOption);
  for (let k in opt.scores) {
    scores[k] += opt.scores[k];
  }

  if (currentQIndex < 14) {
    currentQIndex++;
    renderQuestion();
  } else {
    showLoading();
  }
}

function showLoading() {
  document.getElementById('quiz').classList.add('hidden-section');
  document.getElementById('loading').classList.remove('hidden-section');

  const loadingTexts = [
    "分析你的生活节奏偏好...",
    "匹配你的社交能量类型...",
    "定位你的事业野心指数...",
    "计算你的浪漫情怀浓度...",
    "正在连接城市灵魂信号...",
    "找到啦！你的本命城市是..."
  ];
  let i = 0;
  const textEl = document.getElementById('loadingText');
  const interval = setInterval(() => {
    i++;
    if (i < loadingTexts.length) {
      textEl.textContent = loadingTexts[i];
    } else {
      clearInterval(interval);
      showResult();
    }
  }, 600);
}

function showResult() {
  // 匹配最佳城市结果
  let bestResult = cityResults[0];
  let bestScore = -1;
  // 先尝试精确匹配
  for (const r of cityResults) {
    if (r.match(scores)) {
      bestResult = r;
      break;
    }
  }
  // 如果没有精确匹配，用加权评分
  if (!bestResult.match(scores)) {
    for (const r of cityResults) {
      // 简单计算匹配度：用r的倾向方向
      let s = 0;
      // 基于每个result的id粗略对应，这里用一个通用评分
      // 实际我们用维度距离来算
      const archetype = getArchetypeScores(r.id);
      let dist = 0;
      for (let k in archetype) {
        dist += Math.abs(archetype[k] - scores[k]);
      }
      if (bestScore === -1 || dist < bestScore) {
        bestScore = dist;
        bestResult = r;
      }
    }
  }

  document.getElementById('loading').classList.add('hidden-section');
  document.getElementById('result').classList.remove('hidden-section');

  document.getElementById('resultEmoji').textContent = bestResult.emoji;
  document.getElementById('resultTitle').textContent = bestResult.name;
  document.getElementById('resultSubtitle').textContent = '代表城市：' + bestResult.city;
  document.getElementById('resultCity').textContent = bestResult.city;
  document.getElementById('resultCityDesc').textContent = bestResult.cityDesc;
  document.getElementById('personalityDesc').textContent = bestResult.desc;
  document.getElementById('lifestyleDesc').textContent = bestResult.lifestyle;
  document.getElementById('tipText').textContent = bestResult.tip;

  // 匹配度
  const matchScoreVal = 85 + Math.floor(Math.random() * 14);
  document.getElementById('matchScore').textContent = '匹配度 ' + matchScoreVal + '%';

  // 标签
  const tagsContainer = document.querySelector('#result .flex.flex-wrap');
  tagsContainer.innerHTML = '';
  bestResult.tags.forEach(tag => {
    const tagEl = document.createElement('span');
    tagEl.className = 'tag-chip bg-orange-100 text-orange-700 px-3 py-1.5 rounded-full text-sm font-medium';
    tagEl.textContent = '#' + tag;
    tagsContainer.appendChild(tagEl);
  });

  // 其他适配城市
  const otherContainer = document.getElementById('otherCities');
  otherContainer.innerHTML = '';
  bestResult.others.forEach((o, i) => {
    const div = document.createElement('div');
    div.className = 'flex items-start gap-3 p-3 bg-orange-50/60 rounded-xl';
    div.innerHTML = `
      <div class="w-8 h-8 rounded-full bg-orange-500 text-white flex items-center justify-center text-sm font-bold shrink-0">${i+1}</div>
      <div>
        <p class="font-semibold text-gray-800 text-[15px]">${o.city}</p>
        <p class="text-gray-600 text-sm">${o.reason}</p>
      </div>
    `;
    otherContainer.appendChild(div);
  });

  // 滚动到顶部
  window.scrollTo(0, 0);
}

function getArchetypeScores(id) {
  // 每种类型的典型分数画像（15题满分30分维度）
  const archetypes = {
    chengdu:   { chill:22, ambitious:8, relax:22, energetic:10, introvert:8, outgoing:20, romantic:12, practical:22 },
    shanghai:  { chill:6,  ambitious:26, relax:6,  energetic:24, introvert:6, outgoing:18, romantic:18, practical:22 },
    sanya:     { chill:26, ambitious:4,  relax:24, energetic:8,  introvert:14, outgoing:14, romantic:28, practical:6  },
    beijing:   { chill:8,  ambitious:20, relax:10, energetic:22, introvert:10, outgoing:20, romantic:24, practical:14 },
    chongqing: { chill:16, ambitious:10, relax:10, energetic:26, introvert:6, outgoing:26, romantic:20, practical:16 },
    hangzhou:  { chill:18, ambitious:14, relax:20, energetic:12, introvert:20, outgoing:10, romantic:22, practical:16 },
    xian:      { chill:14, ambitious:10, relax:20, energetic:14, introvert:10, outgoing:20, romantic:28, practical:12 },
    shenzhen:  { chill:6,  ambitious:28, relax:4,  energetic:28, introvert:8, outgoing:12, romantic:10, practical:26 },
    xiamen:    { chill:22, ambitious:6,  relax:22, energetic:10, introvert:12, outgoing:18, romantic:24, practical:10 },
    harbin:    { chill:14, ambitious:10, relax:10, energetic:22, introvert:4, outgoing:28, romantic:14, practical:20 },
    guangzhou: { chill:22, ambitious:8,  relax:20, energetic:12, introvert:8, outgoing:20, romantic:10, practical:24 },
    suzhou:    { chill:20, ambitious:6,  relax:26, energetic:6,  introvert:26, outgoing:6,  romantic:18, practical:20 }
  };
  return archetypes[id] || archetypes.chengdu;
}

function restartQuiz() {
  document.getElementById('result').classList.add('hidden-section');
  document.getElementById('welcome').classList.remove('hidden-section');
  window.scrollTo(0, 0);
}

function shareResult() {
  const toast = document.getElementById('shareToast');
  toast.classList.remove('hidden');
  setTimeout(() => toast.classList.add('hidden'), 2500);
}
</script>
